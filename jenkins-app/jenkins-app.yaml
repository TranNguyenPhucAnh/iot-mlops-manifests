apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # Prevent delete issues
spec:
  destination:
    namespace: jenkins
    server: https://kubernetes.default.svc
  source:
    path: apps/jenkins # Chứa Chart.yaml + values.yaml
    repoURL: https://github.com/TranNguyenPhucAnh/iot-mlops-manifests.git
    targetRevision: HEAD
    # Helm config
    helm:
      releaseName: jenkins-cd
      valueFiles:
        - values.yaml # File values.yaml của bạn
  project: default
  syncPolicy:   # Sync policy production-ready
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false  # ✅ Fix: snake_case thay vì camelCase
      - PrunePropagationPolicy=foreground # Safe delete
      - Prune=true
      - Replace=true # Force replace conflicting resources
      - ServerSideApply=true    # ✅ Handle existing resources
      - ApplyOutOfSyncOnly=true # ✅ Chỉ sync diff
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
