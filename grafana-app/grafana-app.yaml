apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TranNguyenPhucAnh/iot-mlops-manifests.git
    path: apps/grafana-alloy
    targetRevision: main
    helm:
      valueFiles: ["values.yaml"]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
