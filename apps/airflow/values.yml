# iot-mlops-manifests/apps/airflow/values.yaml
config:
  core:
    dags_are_paused_at_creation: "true"
    load_examples: "false" # Tắt các DAG mẫu cho nhẹ máy

# Sử dụng IAM Role cho Service Account (IRSA) để Airflow có quyền S3/SQS
serviceAccount:
  create: true
  annotations:
    # THAY THẾ bằng ARN của IAM Role bạn đã tạo ở phần Terraform
    eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"

# Cấu hình để Airflow tự động lấy code Python (DAG) từ một Git khác
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git" # Repo chứa code xử lý data
    branch: "main"
    wait: 60

# Tối ưu tài nguyên để không vượt quá mức $200/tháng
# Giảm RAM cho Postgres đi kèm
postgresql:
  enabled: true
  install: true
  primary:
    persistence:
      enabled: false
      storageClass: null
      size: 1Gi  # Dummy, không dùng
  # Override global cho subchart
  extraEnvVars:
    - name: SKIP_PERSISTENCE
      value: "true"
redis:
  enabled: true
  install: true
  master:
    persistence:
      enabled: false
      storageClass: null
  replica:
    persistence:
      enabled: false
      storageClass: null
# Tắt tất cả persistence khác
dags:
  persistence:
    enabled: false
    storageClass: null
logs:
  persistence:
    enabled: false
    storageClass: null

# Giảm RAM cho các bộ phận chính của Airflow
webserver:
  resources:
    requests:
      memory: "512Mi"
      
scheduler:
  resources:
    requests:
      memory: "512Mi"
      
# 3. Giảm số lượng Worker xuống tối thiểu
workers:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

triggerer:
  enabled: false
statsd:
  enabled: false
