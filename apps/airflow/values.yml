# iot-mlops-manifests/apps/airflow/values.yaml

# Cấu hình Airflow core
config:
  core:
    dags_are_paused_at_creation: "true"
    load_examples: "false"  # Tắt các DAG mẫu cho nhẹ máy

# Executor (giữ CeleryExecutor mặc định, dùng Redis)
executor: CeleryExecutor

# Sử dụng IAM Role cho Service Account (IRSA) để Airflow có quyền S3/SQS
serviceAccount:
  create: true
  annotations:
    # THAY THẾ bằng ARN của IAM Role bạn đã tạo ở phần Terraform (đảm bảo trust đúng namespace/serviceAccount)
    eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"

# Cấu hình để Airflow tự động lấy code Python (DAG) từ Git
dags:
  gitSync:
    enabled: true
    repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
    branch: "main"
    wait: 60
    # Nếu repo private, cần thêm credentials (tạo secret trước trong namespace airflow)
    # credentialsSecret: "github-dags-secret"

  # (Tuỳ chọn) Lưu DAGs trên PVC gp3 nếu muốn
  # persistence:
  #   enabled: true
  #   storageClass: "gp3"
  #   size: 2Gi

# PostgreSQL nội bộ cho Airflow
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: "16.4.0-debian-12-r8"
  primary:
    persistence:
      enabled: true      # Đã có gp3 nên bật persistence
      size: 4Gi
      storageClass: "gp3"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"

# Redis nội bộ cho CeleryExecutor
redis:
  enabled: true
  master:
    persistence:
      enabled: true      # Rõ ràng: dùng PVC gp3 cho Redis
      storageClass: "gp3"
      size: 1Gi
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"

# Webserver
webserver:
  resources:
    requests:
      memory: "512Mi"

# Scheduler
scheduler:
  resources:
    requests:
      memory: "512Mi"

# Worker (Celery)
workers:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

# Tắt Triggerer (không dùng)
triggerer:
  enabled: false

# Tắt StatsD để giảm tài nguyên
statsd:
  enabled: false
