  # iot-mlops-manifests/apps/airflow/values.yaml
  # Airflow Helm Chart Configuration
airflow:
  # ========================================
  # Executor Configuration
  # ========================================
  executor: CeleryExecutor
  
  # ========================================
  # DAGs Git Sync Configuration
  # ========================================
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
      branch: "main"
      rev: "HEAD"
      subPath: ""
      depth: 1
      wait: 60
      credentialsSecret: "github-dags-secret"
  
  # ========================================
  # External Database & Redis Configuration
  # ========================================
  data:
    metadataConnection:
      user: airflow_user
      pass: airflow_password
      protocol: postgresql
      host: terraform-20260113081933136600000010.c1cai26e25hh.ap-southeast-1.rds.amazonaws.com
      port: 5432
      db: airflow
      sslmode: "require"
    
    # Redis cho Celery
    brokerUrl: redis://airflow-redis.m4jhlh.0001.apse1.cache.amazonaws.com:6379/0
  
  # Tắt PostgreSQL và Redis nội bộ
  postgresql:
    enabled: false
  
  redis:
    enabled: false
  
  # ========================================
  # Airflow Core Configuration
  # ========================================
  config:
    # API configuration (fix deprecation warning)
    api:
      auth_backends: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    
    # Core settings
    core:
      dags_are_paused_at_creation: 'true'
      load_examples: 'false'
      executor: CeleryExecutor
      parallelism: 32
      dag_concurrency: 16
      max_active_runs_per_dag: 16
      # Tăng timeout cho DAG processing
      dag_file_processor_timeout: 300
      dagbag_import_timeout: 300
    
    # Celery configuration
    celery:
      worker_concurrency: 16
      worker_autoscale: '16,8'
      worker_prefetch_multiplier: 1
      worker_max_tasks_per_child: 200
      visibility_timeout: 21600  # 6 hours
      task_track_started: 'True'
      task_time_limit: 7200  # 2 hours
      task_soft_time_limit: 3600  # 1 hour
      pool: prefork
    
    # Celery broker transport options
    celery_broker_transport_options:
      visibility_timeout: 21600
      max_retries: 3
      interval_start: 0
      interval_step: 0.2
      interval_max: 0.5
    
    # S3 Remote Logging
    logging:
      remote_logging: 'True'
      remote_base_log_folder: 's3://iot-bme680-data-lake-prod/airflow-logs'
      remote_log_conn_id: 'aws_default'
      logging_level: 'INFO'
      colored_console_log: 'False'
      encrypt_s3_logs: 'True'
  
  # ========================================
  # Scheduler Configuration
  # ========================================
  scheduler:
    replicas: 1
    
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
    
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
  
  # ========================================
  # Worker Configuration (KEY FIX HERE)
  # ========================================
  workers:
    replicas: 2
    
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    
    persistence:
      enabled: true
      size: 10Gi
    
    # ✅ KEY FIX: Worker-specific probes
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60  # Đợi worker khởi động xong
      periodSeconds: 30        # Check mỗi 30s
      timeoutSeconds: 10       # Timeout cho mỗi check
      failureThreshold: 10     # Phải fail 10 lần mới kill (10*30=300s)
      
      # ✅ CRITICAL: Sử dụng exec command thay vì httpGet
      exec:
        command:
          - sh
          - -c
          - |
            celery -A airflow.providers.celery.executors.celery_executor inspect ping -d celery@$HOSTNAME
    
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
      
      # ✅ CRITICAL: Sử dụng exec command
      exec:
        command:
          - sh
          - -c
          - |
            celery -A airflow.providers.celery.executors.celery_executor inspect ping -d celery@$HOSTNAME
    
    terminationGracePeriodSeconds: 600  # Đợi 10 phút trước khi force kill
  
  # ========================================
  # Webserver Configuration
  # ========================================
  webserver:
    replicas: 1
    
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 5
      httpGet:
        path: /health
        port: 8080
    
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
      httpGet:
        path: /health
        port: 8080
  
  # ========================================
  # Triggerer (Disabled)
  # ========================================
  triggerer:
    enabled: false
  
  # ========================================
  # StatsD (Disabled)
  # ========================================
  statsd:
    enabled: false
  
  # ========================================
  # Flower (Disabled)
  # ========================================
  flower:
    enabled: false
  
  # ========================================
  # Database Migration Jobs
  # ========================================
  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false
  
  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync
  
  # ========================================
  # Wait for Migrations
  # ========================================
  waitForMigrations:
    enabled: true
    timeout: 300
  
  # ========================================
  # Logs Persistence
  # ========================================
  logs:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: gp3  # Thay bằng storage class của bạn
  
  # ========================================
  # Ingress (Disabled)
  # ========================================
  ingress:
    web:
      enabled: false
