# iot-mlops-manifests/apps/airflow/values.yaml
# Executor (giữ CeleryExecutor mặc định, dùng Redis)
airflow:
  executor: CeleryExecutor
  
  # Celery configuration
  celery:
    worker_concurrency: 8 # Fixed slots
    worker_autoscale: '8,4' # max=8, min=4 ← SỬA!
    worker_prefetch_multiplier: 1 # Giữ
    worker_max_tasks_per_child: 100 # Giảm restart thường xuyên
    visibility_timeout: 21600  # 6 hours
    task_track_started: 'True'
    task_time_limit: 7200  # 2 hours
    task_soft_time_limit: 3600  # 1 hour
    pool: prefork 
  
  # Celery broker transport options
  celery_broker_transport_options:
    visibility_timeout: 21600
    max_retries: 3
    interval_start: 0
    interval_step: 0.2
    interval_max: 0.5
    
  # Cấu hình để Airflow tự động lấy code Python (DAG) từ Git
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
      branch: "main"
      rev: "HEAD"            # Hoặc tag/commit
      ref: "main"            # Branch ref
      subPath: ""            # "" nếu DAGs ở root; "dags/" nếu folder dags/
      depth: 1
      wait: 60
      # Nếu repo private, cần thêm credentials (tạo Kubernetes Secret trước trong namespace airflow)
      credentialsSecret: "github-dags-secret"
  
  # Cấu hình ingress cho API Server
  ingress:
    apiServer:
      enabled: false
      # ingressClassName: alb
      # annotations:
      #   alb.ingress.kubernetes.io/scheme: internet-facing
      #   alb.ingress.kubernetes.io/target-type: ip
      # path: /
      # pathType: Prefix
      # hosts:
      #   - name: ""

  # PostgreSQL nội bộ cho Airflow
  postgresql:
    enabled: false

  # Redis nội bộ cho CeleryExecutor
  redis:
    enabled: false

  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false

  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync

  waitForMigrations:
    enabled: true
    timeout: 300
    retries: 30

  # Cấu hình DB bên ngoài (RDS)
  data:
    metadataConnection:
      user: airflow_user
      pass: airflow_password
      protocol: postgresql
      host: db.airflow.local.iot-mlops-dns # Record CNAME trên R53 trỏ về RDS endpoint
      port: 5432
      db: airflow
      sslmode: "require"
    brokerUrl: redis://airflow-redis.m4jhlh.0001.apse1.cache.amazonaws.com:6379/0

  # Cấu hình Airflow core
  config:
    # S3 remote logging
    logging:
      remote_logging: 'True'
      remote_base_log_folder: 's3://iot-bme680-data-lake-prod/airflow-logs'
      remote_log_conn_id: 'aws_default'
      # Thêm config cho S3
      logging_level: 'INFO'
      colored_console_log: 'False'
      encrypt_s3_logs: 'True'
    core:
      dags_are_paused_at_creation: 'true'
      load_examples: 'false'
      executor: CeleryExecutor
      parallelism: 16
      dag_concurrency: 8
      max_active_runs_per_dag: 4
      # Tăng timeout cho DAG processing
      dag_file_processor_timeout: 300
      dagbag_import_timeout: 300
      task_acks_late: 'True'   # Ack after complete

  connections:
    - id: aws_default
      type: aws
      description: AWS default connection
      extra: |-
        { "region_name":"ap-southeast-1" }
        
   #t3.medium (2 vCPU/4Gi RAM) không đủ allocatable resources sau trừ system daemonsets (kube-proxy, etc. ~0.5-1 vCPU/1Gi), chỉ còn ~1.5 vCPU/3Gi; requests scheduler 2Gi CPU + 1Gi RAM vượt quá
  # Scheduler
  scheduler:
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        cpu: "200m"
        memory: "1Gi"
      limits:
        cpu: "1Gi"
        memory: "2Gi"

  # Worker (Celery)
  workers:
    replicas: 1  # Giữ 1 dev
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        cpu: "500m"      # Giảm mạnh CPU Request để nhường chỗ cho Jenkins
        memory: "3Gi"    # GIỮ NGUYÊN mức RAM bạn đã test ổn định
      limits:
        cpu: "1000m"     # Cho phép nó "bung" lên khi cần
        memory: "6Gi"
    persistence:
      enabled: false
      
  apiServer:
    replicas: 1  # HA setup
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        cpu: "200m"
        memory: "1Gi"
      limits:
        cpu: "1Gi"
        memory: "2Gi"

  image:
    repository: "408279620390.dkr.ecr.ap-southeast-1.amazonaws.com/iot-mlops-repo"
    tag: "commit-abc1234"  # Will be updated by Jenkins
    pullPolicy: IfNotPresent
    
  # Environment variables for MLflow
  env:
    - name: MLFLOW_TRACKING_URI
      value: "http://mlflow.mlflow.svc.cluster.local:5000"
    - name: AWS_DEFAULT_REGION
      value: "ap-southeast-1"

  # Tắt Triggerer (không dùng)
  triggerer:
    enabled: false

  # Tắt StatsD để giảm tài nguyên
  statsd:
    enabled: false

  # Tắt flower nếu không cần
  flower:
    enabled: false
