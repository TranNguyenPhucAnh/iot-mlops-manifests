# iot-mlops-manifests/apps/airflow/values.yaml
# Executor (giữ CeleryExecutor mặc định, dùng Redis)
airflow:
  executor: CeleryExecutor

  # Cấu hình để Airflow tự động lấy code Python (DAG) từ Git
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
      branch: "main"
      rev: "HEAD"            # Hoặc tag/commit
      ref: "main"            # Branch ref
      subPath: ""            # "" nếu DAGs ở root; "dags/" nếu folder dags/
      depth: 1
      wait: 60
      # Nếu repo private, cần thêm credentials (tạo Kubernetes Secret trước trong namespace airflow)
      credentialsSecret: "github-dags-secret"
      
  # Cấu hình ingress cho API Server
  ingress:
    apiServer:
      enabled: false
      # ingressClassName: alb
      # annotations:
      #   alb.ingress.kubernetes.io/scheme: internet-facing
      #   alb.ingress.kubernetes.io/target-type: ip
      # path: /
      # pathType: Prefix
      # hosts:
      #   - name: ""

  # PostgreSQL nội bộ cho Airflow
  postgresql:
    enabled: false

  # Redis nội bộ cho CeleryExecutor
  redis:
    enabled: false

  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false

  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync

  waitForMigrations:
    enabled: true
    timeout: 300
    retries: 30

  # Cấu hình DB bên ngoài (RDS)
  data:
    metadataConnection:
      user: airflow_user
      pass: airflow_password
      protocol: postgresql
      host: terraform-20260113081933136600000010.c1cai26e25hh.ap-southeast-1.rds.amazonaws.com
      port: 5432
      db: airflow
      sslmode: "require"
    brokerUrl: redis://airflow-redis.m4jhlh.0001.apse1.cache.amazonaws.com:6379/0

  # Cấu hình Airflow core
  config:
    # S3 remote logging
    logging:
      remote_logging: 'True'
      remote_base_log_folder: 's3://iot-bme680-data-lake-prod/airflow-logs'
      remote_log_conn_id: 'aws_default'
      # Thêm config cho S3
      logging_level: 'INFO'
      colored_console_log: 'False'
      colored_log_format: '[%%(blue)s%%(asctime)s%%(reset)s] {{%%(blue)s%%(filename)s:%%(reset)s%%(lineno)d}} %%(log_color)s%%(levelname)s%%(reset)s - %%(log_color)s%%(message)s%%(reset)s'
    core:
      dags_are_paused_at_creation: "true"
      load_examples: "false" # Tắt các DAG mẫu cho nhẹ máy
      
  # Scheduler
  scheduler:
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        memory: "512Mi"

  # Worker (Celery)
  workers:
    replicas: 1  # Giữ 1 dev
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:   # Minimum node alloc
        cpu:    "500m"    # 500m cho DAG parse
        memory: "1Gi"     # 4x hiện tại (1Gi đủ dev)
      limits:     # Hard cap tránh OOM toàn node
        cpu:    "1Gi"
        memory: "2Gi"
    persistence:
      enabled: false
      
  apiServer:
    replicas: 2  # HA setup
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
          
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    timeoutSeconds: 10
    failureThreshold: 10
    periodSeconds: 30
    httpGet:
      path: /health
      port: 8080
      
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    timeoutSeconds: 10
    failureThreshold: 10
    periodSeconds: 20
    httpGet:
      path: /health
      port: 8080
  
  env:
    - name: AIRFLOW__WEBSERVER__WORKERS
      value: "2"
    - name: AIRFLOW__WEBSERVER__WORKER_TIMEOUT
      value: "120"
    - name: AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT
      value: "120"

  # Tắt Triggerer (không dùng)
  triggerer:
    enabled: false

  # Tắt StatsD để giảm tài nguyên
  statsd:
    enabled: false

  # Tắt flower nếu không cần
  flower:
    enabled: false
