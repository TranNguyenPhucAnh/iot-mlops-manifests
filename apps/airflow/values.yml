# iot-mlops-manifests/apps/airflow/values.yaml
# Executor (giữ CeleryExecutor mặc định, dùng Redis)
airflow:
  airflowVersion: "3.0.2"
  executor: CeleryExecutor
  
  # Sử dụng IAM Role cho Service Account (IRSA) để Airflow có quyền S3/SQS
  serviceAccount:
    create: true
    annotations:
      # THAY THẾ bằng ARN của IAM Role bạn đã tạo ở phần Terraform (đảm bảo trust đúng namespace/serviceAccount)
      eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
  
  # Cấu hình để Airflow tự động lấy code Python (DAG) từ Git
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
      branch: "main"
      wait: 60
      # Nếu repo private, cần thêm credentials (tạo Kubernetes Secret trước trong namespace airflow)
      credentialsSecret: "github-dags-secret"

  apiServer:
    enabled: true

  # Cấu hình Ingress dành riêng cho API Server
  ingress:
    apiServer:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
      path: /
      pathType: Prefix
      # Nếu bạn dùng host cụ thể
      hosts: 
        - name: ""
        
  webserver:
    resources:
      requests:
        memory: "512Mi"
    
  # PostgreSQL nội bộ cho Airflow
  postgresql:
    enabled: false
  
  # Redis nội bộ cho CeleryExecutor
  redis:
    enabled: false

  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false
  
  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync
      
  waitForMigrations:
    enabled: true
    timeout: 300
    retries: 30
  
  # Cấu hình DB bên ngoài (RDS)
  data:
    metadataConnection:
      user: airflow_user
      pass: airflow_password
      protocol: postgresql
      host: terraform-20260107032119155500000010.c1cai26e25hh.ap-southeast-1.rds.amazonaws.com
      port: 5432
      db: airflow
      sslmode: "require"
    brokerUrl: redis://airflow-redis.m4jhlh.0001.apse1.cache.amazonaws.com:6379/0

  # Cấu hình Airflow core
  config:
    core:
      dags_are_paused_at_creation: "true"
      load_examples: "false"  # Tắt các DAG mẫu cho nhẹ máy

  # Scheduler
  scheduler:
    resources:
      requests:
        memory: "512Mi"

  # Worker (Celery)
  workers:
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
    persistence:
      enabled: false  # Tắt persistence nếu không cần

  # Tắt Triggerer (không dùng)
  triggerer:
    enabled: false
  
  # Tắt StatsD để giảm tài nguyên
  statsd:
    enabled: false
  
  # Tắt flower nếu không cần
  flower:
    enabled: false
