# iot-mlops-manifests/apps/airflow/values.yaml
# Executor (giữ CeleryExecutor mặc định, dùng Redis)
airflow:
  executor: CeleryExecutor
  
  # Celery configuration
  celery:
    worker_concurrency: 16
    worker_autoscale: '16,8'
    worker_prefetch_multiplier: 1
    worker_max_tasks_per_child: 200
    visibility_timeout: 21600  # 6 hours
    task_track_started: 'True'
    task_time_limit: 7200  # 2 hours
    task_soft_time_limit: 3600  # 1 hour
    pool: prefork
  
  # Celery broker transport options
  celery_broker_transport_options:
    visibility_timeout: 21600
    max_retries: 3
    interval_start: 0
    interval_step: 0.2
    interval_max: 0.5
    
  # Cấu hình để Airflow tự động lấy code Python (DAG) từ Git
  dags:
    gitSync:
      enabled: true
      repo: "https://github.com/TranNguyenPhucAnh/iot-mlops-python-dag.git"
      branch: "main"
      rev: "HEAD"            # Hoặc tag/commit
      ref: "main"            # Branch ref
      subPath: ""            # "" nếu DAGs ở root; "dags/" nếu folder dags/
      depth: 1
      wait: 60
      # Nếu repo private, cần thêm credentials (tạo Kubernetes Secret trước trong namespace airflow)
      credentialsSecret: "github-dags-secret"
      
  # Cấu hình ingress cho API Server
  ingress:
    apiServer:
      enabled: false
      # ingressClassName: alb
      # annotations:
      #   alb.ingress.kubernetes.io/scheme: internet-facing
      #   alb.ingress.kubernetes.io/target-type: ip
      # path: /
      # pathType: Prefix
      # hosts:
      #   - name: ""

  # PostgreSQL nội bộ cho Airflow
  postgresql:
    enabled: false

  # Redis nội bộ cho CeleryExecutor
  redis:
    enabled: false

  createUserJob:
    useHelmHooks: false
    applyCustomEnv: false

  migrateDatabaseJob:
    useHelmHooks: false
    applyCustomEnv: false
    jobAnnotations:
      "argocd.argoproj.io/hook": Sync

  waitForMigrations:
    enabled: true
    timeout: 300
    retries: 30

  # Cấu hình DB bên ngoài (RDS)
  data:
    metadataConnection:
      user: airflow_user
      pass: airflow_password
      protocol: postgresql
      host: terraform-20260113081933136600000010.c1cai26e25hh.ap-southeast-1.rds.amazonaws.com
      port: 5432
      db: airflow
      sslmode: "require"
    brokerUrl: redis://airflow-redis.m4jhlh.0001.apse1.cache.amazonaws.com:6379/0

  # Cấu hình Airflow core
  config:
    # S3 remote logging
    logging:
      remote_logging: 'True'
      remote_base_log_folder: 's3://iot-bme680-data-lake-prod/airflow-logs'
      remote_log_conn_id: 'aws_default'
      # Thêm config cho S3
      logging_level: 'INFO'
      colored_console_log: 'False'
      encrypt_s3_logs: 'True'
    core:
      dags_are_paused_at_creation: 'true'
      load_examples: 'false'
      executor: CeleryExecutor
      parallelism: 32
      dag_concurrency: 16
      max_active_runs_per_dag: 16
      # Tăng timeout cho DAG processing
      dag_file_processor_timeout: 300
      dagbag_import_timeout: 300
      
  # Scheduler
  scheduler:
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 10
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Worker (Celery)
  workers:
    replicas: 1  # Giữ 1 dev
    livenessProbe:
      enabled: true
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 10
      exec:
        command:
          - sh
          - -c
          - |
            celery -A airflow.providers.celery.executors.celery_executor inspect ping -d celery@$HOSTNAME
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 5
      exec:
        command:
          - sh
          - -c
          - |
            celery -A airflow.providers.celery.executors.celery_executor inspect ping -d celery@$HOSTNAME
    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        cpu: "1000m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    persistence:
      enabled: false
      
  apiServer:
    replicas: 2  # HA setup
    livenessProbe:
      enabled: true
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 20
      timeoutSeconds: 10
      failureThreshold: 6   # 6 * 20 = 120s cho liveness
    readinessProbe:
      enabled: true
      httpGet:
        path: /api/v1/health
        port: 8080
      initialDelaySeconds: 40
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6\

    startupProbe:
      enabled: true
      httpGet:
        # hoặc /health nếu bạn expose route này
        path: /api/v2/version
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30  # 30 * 10 = 300s, dư thời gian cho lần start đầu

    serviceAccount:
      create: true  # ← Để chart tự tạo
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/AirflowAccessRole"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # Tắt Triggerer (không dùng)
  triggerer:
    enabled: false

  # Tắt StatsD để giảm tài nguyên
  statsd:
    enabled: false

  # Tắt flower nếu không cần
  flower:
    enabled: false
