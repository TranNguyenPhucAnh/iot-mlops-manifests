apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: 'true'
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  source:
    path: 'apps/common'
    repoURL: 'https://github.com/TranNguyenPhucAnh/iot-mlops-manifests.git'
    targetRevision: HEAD
  project: 'default'
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
