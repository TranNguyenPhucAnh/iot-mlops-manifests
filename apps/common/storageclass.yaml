apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    # Dòng này cực kỳ quan trọng: Biến gp3 thành mặc định cho toàn Cluster
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com # Phải khớp với tên của Driver bạn cài
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
