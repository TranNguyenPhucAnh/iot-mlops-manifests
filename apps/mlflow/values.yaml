mlflow:
  # Sửa từ Array sang Object để khớp với Schema
  extraEnvVars:
    # MLflow 3.5+ mặc định chặn Host header nội bộ, env controls Host headers mà server chấp nhận
    # Nếu có Ingress/reverse proxy/expose MLflow qua Ingress với host value mlflow.my-domain.com, cũng cần thêm host đó dưới dạng
    # value: mlflow.my-domain.com,mlflow.mlflow.svc.cluster.local,localhost
    #MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow.mlflow.svc.cluster.local,mlflow.mlflow,localhost,127.0.0.1"
    MLFLOW_SERVER_ALLOWED_HOSTS: "*"

  backendStore:
    postgres:
      enabled: true
      host: db.airflow.local.iot-mlops-dns
      port: 5432
      database: mlflow
      user: mlflow_user
      password: mlflow_password
  
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::408279620390:role/AirflowAccessRole
  
  artifactRoot:
    s3:
      enabled: true
      bucket: iot-bme680-data-lake-prod
      path: mlflow-artifacts
