jenkins:
  controller:
    componentName: jenkins-controller
        
    image:
      repository: jenkins/jenkins
      tag: "lts"
  
    serviceAccount:
      create: false
      name: jenkins-sa
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/jenkins-controller-irsa"
        
    existingSecret: jenkins-jcasc-secrets # load secrets

    admin:
      existingSecret: jenkins-jcasc-secrets
      userKey: JENKINS_ADMIN_USER
      passwordKey: JENKINS_ADMIN_PASSWORD
      
    javaOpts: >
      -Xms512m
      -Xmx1024m
      -Djenkins.install.runSetupWizard=false
  
    installPlugins:
      - kubernetes
      - workflow-aggregator
      - git
      - amazon-ecr
      - pipeline-model-definition
      - docker-workflow
      - configuration-as-code
      - role-strategy
  
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  
    serviceType: ClusterIP
    servicePort: 8080

    JCasC:
      defaultConfig: false  # Tắt default để tránh conflict
      configScripts:
        credentials: |
          credentials:
            system:
              domainCredentials:
                - credentials: # Global unrestricted domain
                  - usernamePassword:
                      scope: GLOBAL
                      id: github-token
                      description: "GitHub Personal Access Token"
                      username: "${GITHUB_USERNAME}"
                      password: "${GITHUB_TOKEN}"
                  - usernamePassword:
                      scope: GLOBAL
                      id: docker-registry
                      description: "Docker registry credential"
                      username: "${DOCKER_USERNAME}"
                      password: "${DOCKER_PASSWORD}"
    
        security: |
          jenkins:
            securityRealm:
              local:
                allowsSignup: false
                users:
                  - id: "${JENKINS_ADMIN_USER}"
                    password: "${JENKINS_ADMIN_PASSWORD}"
      
            authorizationStrategy:
              roleBased:
                roles:
                  global:
                    - name: admin
                      description: "Jenkins admin"
                      permissions:
                        - "Overall/Administer"
                      entries:
                        - user: "${JENKINS_ADMIN_USER}"
                  
                    - name: developer
                      description: "Developers"
                      permissions:
                        - "Overall/Read"
                        - "Job/Read"
                        - "Job/Build"
                        - "Job/Workspace"
                        - "View/Read"
                      entries: []
    
        kubernetes-cloud: |
          jenkins:
            clouds:
              - kubernetes:
                  name: "kubernetes"
                  serverUrl: "https://kubernetes.default.svc"
                  namespace: "jenkins"
                  credentialsId: ""
                  skipTlsVerify: false
                  containerCapStr: "10"
                  maxRequestsPerHostStr: "32"
                  jenkinsUrl: "http://jenkins-cd.jenkins.svc.cluster.local:8080" # Controller service (8080)
                  jenkinsTunnel: "jenkins-cd-agent.jenkins.svc.cluster.local:50000" # JNLP service (50000)
          
                  templates:
                    - name: "mlops-agent"
                      label: "mlops"
                      serviceAccount: "jenkins-sa"
                      idleMinutes: 5
                      nodeUsageMode: NORMAL
          
                      containers:
                        - name: "jnlp"
                          image: "bourgeoisie/jenkins-agent-mlops:latest"
                          args: "^${computer.jnlpmac} ^${computer.name}"
                          resourceRequestCpu: "500m"
                          resourceRequestMemory: "1Gi"
                          resourceLimitCpu: "2000m"
                          resourceLimitMemory: "4Gi"
          
                      volumes:
                        - emptyDirVolume:
                            mountPath: "/tmp"
          
                      yamlMergeStrategy: "override"
                    
  agent:
    enabled: true
    image:
      repository: jenkins/inbound-agent
      tag: "latest"
  
  rbac:
    create: true
    readSecrets: true

  persistence:
    enabled: true
    storageClass: gp3
    size: 8Gi
