jenkins:
  controller:
  
    envFrom: #load Kubernetes Secrets định nghĩa trong jenkins-secret.yaml
      - secretRef:
          name: jenkins-jcasc-secrets
        
    JCasC:
      defaultConfig: true  # ← Giữ default config
      
      # Thêm custom configs
      configScripts:
        credentials: |-
          credentials:
            system:
              domainCredentials:
                - credentials:
                    - string:
                        scope: GLOBAL
                        id: github-token
                        description: "GitHub Personal Access Token"
                        secret: "${GITHUB_TOKEN}"
                    - usernamePassword:
                        scope: GLOBAL
                        id: docker-registry
                        description: "Docker registry credential"
                        username: "${DOCKER_USERNAME}"
                        password: "${DOCKER_PASSWORD}"
        
        kubernetes-cloud: |-
          jenkins:
            clouds:
              - kubernetes:
                  name: "kubernetes"
                  serverUrl: "https://kubernetes.default.svc"
                  namespace: "jenkins"
                  credentialsId: ""
                  skipTlsVerify: false
                  containerCapStr: "10"
                  maxRequestsPerHostStr: "32"
                  jenkinsUrl: "http://jenkins-cd.jenkins.svc.cluster.local:8080"
                  jenkinsTunnel: "jenkins-cd-agent.jenkins.svc.cluster.local:50000"
                  podTemplates:
                    - name: "mlops-agent"
                      label: "mlops"
                      serviceAccount: "jenkins-sa"
                      idleMinutes: 5
                      nodeUsageMode: NORMAL
                      containers:
                        - name: "jnlp"
                          image: "your-docker-registry/jenkins-agent-mlops:latest"
                          args: "^${computer.jnlpmac} ^${computer.name}"
                          resourceRequestCpu: "500m"
                          resourceRequestMemory: "1Gi"
                          resourceLimitCpu: "2000m"
                          resourceLimitMemory: "4Gi"
                      volumes:
                        - emptyDirVolume:
                            mountPath: "/tmp"
                      yamlMergeStrategy: "override"
        
        security: |-
          jenkins:
            securityRealm:
              local:
                allowsSignup: false
                users:
                  - id: "${JENKINS_ADMIN_USER}"
                    password: "${JENKINS_ADMIN_PASSWORD}"
            
            authorizationStrategy:
              roleBased:
                roles:
                  global:
                    - name: admin
                      description: "Jenkins administrators"
                      permissions:
                        - "Overall/Administer"
                      assignments:
                        - "${JENKINS_ADMIN_USER}"
                    - name: developer
                      description: "Developers"
                      permissions:
                        - "Overall/Read"
                        - "Job/Read"
                        - "Job/Build"
                        - "Job/Workspace"
                        - "View/Read"
                      assignments: []
            
            crumbIssuer: "standard"
          
          unclassified:
            location:
              url: "https://jenkins.example.com"

    componentName: jenkins-controller

    image:
      repository: jenkins/jenkins
      tag: "lts"
  
    # =====================
    # ServiceAccount + IRSA
    # =====================
    serviceAccount:
      create: false               # Terraform quản lý SA
      name: jenkins-sa
      annotations:
        eks.amazonaws.com/role-arn: "arn:aws:iam::408279620390:role/jenkins-controller-irsa"
  
    # =====================
    # Security bootstrap
    # =====================
    admin:
      username: admin
      existingSecret: jenkins-jcasc-secrets
      userKey: JENKINS_ADMIN_USER
      passwordKey: JENKINS_ADMIN_PASSWORD
  
    # Tắt setup wizard (BẮT BUỘC dùng JCasC sau này)
    javaOpts: >
      -Xms512m
      -Xmx1024m
      -Djenkins.install.runSetupWizard=false
  
    # =====================
    # Plugins (PIN VERSION)
    # =====================
    installPlugins:
      - kubernetes
      - workflow-aggregator
      - git
      - amazon-ecr
      - pipeline-model-definition
      - docker-workflow
      - configuration-as-code
      - role-strategy
      # blueocean KHÔNG khuyến khích cho prod lâu dài
      # - blueocean:1.27.10
  
    # =====================
    # Resources
    # =====================
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"
  
    # =====================
    # Service
    # =====================
    serviceType: ClusterIP
    servicePort: 8080
  
    # =====================
    # Kubernetes Cloud (Agents)
    # =====================
    # Plugin kubernetes đã xử lý phần này
    # Không cần enable riêng
  
  agent:
    enabled: true
    image:
      repository: jenkins/inbound-agent
      tag: "latest"
    namespace: jenkins
  
  rbac:
    create: true
    clusterRead: true   # Cho Jenkins dùng kubectl / K8s plugin
  
  persistence:
    enabled: true
    storageClass: gp3
    size: 8Gi
