jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: admin
            description: "Jenkins administrators"
            permissions:
              - "Overall/Administer"
            assignments:
              - "${JENKINS_ADMIN_USER}"

          - name: developer
            description: "Developers"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Workspace"
              - "View/Read"
            assignments: []

unclassified:
  location:
    url: "https://jenkins.example.com"
