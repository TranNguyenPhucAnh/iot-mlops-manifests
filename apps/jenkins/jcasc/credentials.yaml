jenkins:
  credentials:
    system:
      domainCredentials:
        - domain: null
        - credentials:

            - string:
                scope: GLOBAL
                id: github-token
                description: "GitHub Personal Access Token"
                secret: "${GITHUB_TOKEN}"
  
            - usernamePassword:
                scope: GLOBAL
                id: docker-registry
                description: "Docker registry credential"
                username: "${DOCKER_USERNAME}"
                password: "${DOCKER_PASSWORD}"
