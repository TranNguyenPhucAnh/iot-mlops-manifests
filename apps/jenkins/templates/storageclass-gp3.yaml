apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com # CSI driver phát hiện PVC resource (persistence.enabled: true), đọc StorageClass manifest, provision EBS volume & gắn vào pod 
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete # khi xoá PVC, reclaimPolicy: Delete gọi CSI xóa volume nếu cluster còn sống, cluster xoá trước → CSI ngừng → volume "mồ côi", cần xóa tay AWS Console/CLI
volumeBindingMode: WaitForFirstConsumer
