apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com # dynamic provisioning: CSI driver provision EBS volume đã config trong values.yaml và attach vào Jenkins pod
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete # controller CSI quản lý vòng đời EBS, khi cluster bị xóa trước, driver cũng bị xoá theo => PVC không trigger delete volume, cần xoá thủ công
volumeBindingMode: WaitForFirstConsumer
