alloy:
  alloy:
    clustering:
      enabled: true
    statsd:
      enabled: true
    configMap:
      content: |
        // ============ 1. EXPORTERS TRƯỚC ============

        prometheus.remote_write "grafana_cloud" {
          endpoint {
            url = "https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push"
            basic_auth {
              username = env("GRAFANA_PROM_INSTANCE_ID")
              password = env("GRAFANA_CLOUD_API_KEY")
            }
          }
          external_labels = {
            cluster = "eks-airflow",
          }
        }
        
        loki.write "grafana_cloud" {
          endpoint {
            url = "https://logs-prod-020.grafana.net/loki/api/v1/push"
            basic_auth {
              username = env("GRAFANA_LOKI_INSTANCE_ID")
              password = env("GRAFANA_CLOUD_API_KEY")
            }
          }
          external_labels = {
            cluster   = "eks-airflow",
            namespace = "airflow",
          }
        }
        
        otelcol.auth.basic "grafana_creds" {
          username = env("GRAFANA_OTLP_INSTANCE_ID")
          password = env("GRAFANA_CLOUD_API_KEY")
        }
        
        otelcol.exporter.otlphttp "grafana_cloud" {
          client {
            endpoint = "https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp"
            auth     = otelcol.auth.basic.grafana_creds.handler
          }
        }
        
        otelcol.processor.batch "default" {
          timeout         = "1s"
          send_batch_size = 1000
          output {
            traces = [otelcol.exporter.otlphttp.grafana_cloud.input]
          }
        }
        
        // ============ 2. DISCOVERY ============
        
        discovery.kubernetes "nodes" {
          role = "node"
        }
        
        discovery.kubernetes "airflow_pods" {
          role = "pod"
          namespaces {
            names = ["airflow"]
          }
        }
        
        discovery.kubernetes "kube_state_metrics" {
          role = "endpoints"
          namespaces {
            names = ["monitoring"]
          }
          selectors {
            role  = "service"
            label = "app.kubernetes.io/name=kube-state-metrics"
          }
        }
        
        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics"
          }
        }
        
        discovery.relabel "kube_state_metrics" {
          targets = discovery.kubernetes.kube_state_metrics.targets
          
          // Đổi rule keep này sang check service name chính xác hơn
          # rule {
          #   source_labels = ["__meta_kubernetes_service_name"]
          #   regex         = ".*kube-state-metrics.*"
          #   action        = "keep"
          # }
          
          // Đảm bảo port 8080 được sử dụng
          rule {
            source_labels = ["__address__"]
            target_label  = "__address__"
            replacement   = "$1" // Giữ nguyên address từ discovery vì KSM service port thường là 8080
          }
        }
        
        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          }
        }
        
        // ============ 3. SCRAPES SAU ============
        
        prometheus.scrape "kubelet" {
          targets           = discovery.relabel.kubelet.output
          scheme            = "https"
          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.grafana_cloud.receiver]
        }
        
        prometheus.scrape "cadvisor" {
          targets           = discovery.relabel.cadvisor.output
          scheme            = "https"
          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.grafana_cloud.receiver]
        }
        
        prometheus.scrape "kube_state_metrics" {
          targets         = discovery.relabel.kube_state_metrics.output
          scrape_interval = "30s"
          forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
        }
        
        // ============ 4. LOGS ============
        
        loki.source.kubernetes "airflow" {
          targets    = discovery.relabel.airflow_pods.output
          forward_to = [loki.write.grafana_cloud.receiver]
        }
        
        // ============ 5. TRACES ============
        
        otelcol.receiver.otlp "airflow" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

    # Mở ports cho OTLP receiver
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    # Inject credentials từ Secret
    envFrom:
      - secretRef:
          name: grafana-cloud-credentials

  # RBAC để Alloy đọc pods/logs trên EKS
  rbac:
    create: true

  serviceAccount:
    create: true

  # Chạy như DaemonSet để collect logs từ tất cả nodes
  controller:
    type: daemonset

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
  tolerations: []
  service:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"  # HTTP metrics port
      prometheus.io/path: "/metrics"
  collectors:
    - configmaps
    - secrets
    - nodes
    - pods
    - services
    - deployments
    - statefulsets
  extraArgs:
    - --resources=configmaps  # Explicit enable ConfigMap metrics
