alloy:
  alloy:
    clustering:
      enabled: true

    configMap:
      content: |
        // ============ DISCOVERY ============
        discovery.kubernetes "airflow_pods" {
          role = "pod"
          namespaces {
            names = ["airflow"]
          }
        }

        discovery.relabel "airflow_pods" {
          targets = discovery.kubernetes.airflow_pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }
        }

        // ============ LOGS — Loki ============
        loki.source.kubernetes "airflow" {
          targets    = discovery.relabel.airflow_pods.output
          forward_to = [loki.write.grafana_cloud.receiver]
        }

        loki.write "grafana_cloud" {
          endpoint {
            url = "https://logs-prod-020.grafana.net/loki/api/v1/push"
            basic_auth {
              username = env("GRAFANA_LOKI_INSTANCE_ID")
              password = env("GRAFANA_CLOUD_API_KEY")
            }
          }
          external_labels = {
            cluster   = "eks-airflow",
            namespace = "airflow",
          }
        }

        // ============ METRICS ============

        // 1. Kubelet metrics (node-level)
        discovery.kubernetes "nodes" {
          role = "node"
        }

        discovery.relabel "kubelet" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics"
          }
        }

        prometheus.scrape "kubelet" {
          targets    = discovery.relabel.kubelet.output
          scheme     = "https"
          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.grafana_cloud.receiver]
        }

        // 2. cAdvisor metrics (container CPU/memory)
        discovery.relabel "cadvisor" {
          targets = discovery.kubernetes.nodes.targets
          rule {
            target_label = "__address__"
            replacement  = "kubernetes.default.svc:443"
          }
          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label  = "__metrics_path__"
            replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
          }
        }

        prometheus.scrape "cadvisor" {
          targets    = discovery.relabel.cadvisor.output
          scheme     = "https"
          tls_config {
            insecure_skip_verify = true
          }
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
          forward_to        = [prometheus.remote_write.grafana_cloud.receiver]
        }

        // 3. kube-state-metrics (pod info, deployment status)
        discovery.kubernetes "kube_state_metrics" {
          role = "service"
          namespaces {
            names = ["monitoring"]
          }
          selectors {
            role  = "service"
            label = "app.kubernetes.io/name=kube-state-metrics"
          }
        }

        prometheus.scrape "kube_state_metrics" {
          targets        = discovery.kubernetes.kube_state_metrics.targets
          scrape_interval = "30s"
          forward_to     = [prometheus.remote_write.grafana_cloud.receiver]
        }

        // ============ TRACES — Tempo via OTLP ============
        otelcol.receiver.otlp "airflow" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces = [otelcol.processor.batch.default.input]
          }
        }

        otelcol.processor.batch "default" {
          timeout         = "1s"
          send_batch_size = 1000
          output {
            traces = [otelcol.exporter.otlphttp.grafana_cloud.input]
          }
        }

        otelcol.exporter.otlphttp "grafana_cloud" {
          client {
            endpoint = "https://otlp-gateway-prod-ap-southeast-1.grafana.net/otlp"
            auth     = otelcol.auth.basic.grafana_creds.handler
          }
        }

        otelcol.auth.basic "grafana_creds" {
          username = env("GRAFANA_OTLP_INSTANCE_ID")
          password = env("GRAFANA_CLOUD_API_KEY")
        }

    # Mở ports cho OTLP receiver
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP

    # Inject credentials từ Secret
    envFrom:
      - secretRef:
          name: grafana-cloud-credentials

  # RBAC để Alloy đọc pods/logs trên EKS
  rbac:
    create: true

  serviceAccount:
    create: true

  # Chạy như DaemonSet để collect logs từ tất cả nodes
  controller:
    type: daemonset

kube-state-metrics:
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
  tolerations: []
