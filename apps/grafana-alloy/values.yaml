grafana-agent:
  alloy:
    configMap:
      content: |
        // Pi 3 metrics (tunnel scrape Node Exporter)
        discovery.http "pi3" {
          targets = [{ __address__ = "https://pi-metrics.bookstore-demo.online:9100", job = "pi3-node" }]
          refresh_interval = "30s"
        }
        prometheus.scrape "pi3" {
          targets    = discovery.http.pi3.targets
          forward_to = [prometheus.remote_write.prom.receiver]
          tls_config { insecure_skip_verify = true }
        }
        
        // **Bỏ loki.source.http pi_logs** - Fluent Bit Pi3 đã push Loki tunnel
        
        // Airflow K8s logs (local scrape)
        loki.source.kubernetes "airflow" {
          targets    = discovery.kubernetes.pods.targets
          namespaces = ["airflow"]
          forward_to = [loki.write.loki.receiver]
        }
        
        // Loki write (Pi3 Fluent Bit + Airflow → Loki)
        loki.write "loki" {
          endpoint {
            url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
        
        // Prometheus remote_write (Pi3 metrics → kube-prometheus-stack)
        prometheus.remote_write "prom" {
          endpoint {
            url = "http://monitoring-stack-kube-prom-prometheus.monitoring.svc:9090/api/v1/write"
          }
        }
  watch:
    enabled: true
