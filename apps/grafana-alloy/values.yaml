alloy:
  configReloader:
    enabled: true
  # File cấu hình Alloy (River syntax)
  config: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    # Endpoint nhận Log từ Pi 3
    loki.write "local_loki" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
    }

    # Endpoint nhận Metrics từ Pi 3 (Remote Write)
    prometheus.remote_write "local_prom" {
      endpoint {
        url = "http://monitoring-stack-kube-prom-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }
